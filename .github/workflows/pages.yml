name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'LICENSE', 'CONTRIBUTING.md', 'SECURITY.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node scripts/build.mjs
        env:
          COLLECTOR_URL: ${{ vars.COLLECTOR_URL }}
          REPOSITORY_URL: https://github.com/ammarphp/trolley
          OPERATOR_NAME: ammarphp
          CONTACT_URL: https://github.com/ammarphp/trolley
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
