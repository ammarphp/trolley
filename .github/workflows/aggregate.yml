name: Update anonymous run aggregates
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read aggregate-only API
        run: node scripts/sync-aggregates.mjs
        env:
          COLLECTOR_URL: ${{ vars.COLLECTOR_URL }}
      - name: Commit aggregate snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/aggregate.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update anonymous run aggregate snapshot'
            git pull --rebase origin main
            git push
          fi
      - run: node scripts/build.mjs
        env:
          COLLECTOR_URL: ${{ vars.COLLECTOR_URL }}
          REPOSITORY_URL: https://github.com/ammarphp/trolley
          OPERATOR_NAME: ammarphp
          CONTACT_URL: https://github.com/ammarphp/trolley
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
